<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Ricky Casino</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Base Stylesheet -->
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Paramax Theme -->
    <link rel="stylesheet" href="css/paramax.css" />
    <!-- Ricky Theme -->
    <link rel="stylesheet" href="css/ricky.css" />

    <style>
      /* 404 Page Specific Styles */
      body {
        background-color: var(--color-background);
        background-image: none;
      }

      .error-page {
        min-height: calc(100vh - 200px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--spacing-2xl) var(--spacing-lg);
      }

      .error-code {
        font-size: 156px;
        font-weight: 400;
        line-height: 1;
        margin-bottom: 0;
        /* Orange gradient for Ricky */
        background: linear-gradient(180deg, #ea9f32 0%, #d68b20 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .error-message {
        font-size: 30px;
        font-weight: 500;
        color: #ffffff;
        margin-bottom: 20px;
      }

      .error-page .btn {
        text-transform: uppercase;
      }

      .header {
        position: relative;
        background-color: transparent;
        border-bottom: none; /* Remove border if desired for cleaner look, but user said BG */
      }

      .footer {
        margin-top: auto;
        background-color: transparent;
        border-top: none; /* Remove border for cleaner look */
      }

      .footer-wrapper {
        margin-top: auto;
        width: 100%;
        background-color: transparent; /* Ensure wrapper has no bg */
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <a href="ricky.html" class="header__logo">
            <img src="img/ricky/logo.svg" alt="Ricky Casino Logo" />
          </a>

          <nav class="header__nav">
            <ul class="header__nav-list">
              <li>
                <a href="ricky.html" class="header__nav-link">Ricky Casino</a>
              </li>
              <li>
                <a href="ricky-login.html" class="header__nav-link">Login</a>
              </li>
              <li>
                <a href="ricky-download.html" class="header__nav-link"
                  >Download</a
                >
              </li>
            </ul>
          </nav>

          <div class="header__actions">
            <a href="#" class="btn btn--secondary">Registration</a>
            <a href="ricky-login.html" class="btn btn--primary">Log In</a>
          </div>

          <button
            class="header__menu-toggle"
            aria-label="Open menu"
            onclick="openMobileMenu()"
          >
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
      <div class="mobile-menu__header">
        <a href="ricky.html" class="mobile-menu__logo">
          <img src="img/ricky/logo.svg" alt="Ricky Casino Logo" />
        </a>
        <button
          class="mobile-menu__close"
          aria-label="Close menu"
          onclick="closeMobileMenu()"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M18 6L6 18M6 6L18 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      <div class="mobile-menu__actions">
        <a href="#" class="btn btn--secondary">Registration</a>
        <a href="ricky-login.html" class="btn btn--primary">Log In</a>
      </div>
      <nav class="mobile-menu__nav">
        <a href="ricky.html" class="mobile-menu__link">Ricky Casino</a>
        <a href="ricky-login.html" class="mobile-menu__link">Login</a>
        <a href="ricky-download.html" class="mobile-menu__link">Download</a>
      </nav>
    </div>

    <script>
      function openMobileMenu() {
        document.getElementById('mobileMenu').classList.add('is-open')
        document.body.style.overflow = 'hidden'
      }
      function closeMobileMenu() {
        document.getElementById('mobileMenu').classList.remove('is-open')
        document.body.style.overflow = ''
      }
    </script>

    <!-- 404 Content -->
    <main class="error-page">
      <h1 class="error-code">404</h1>
      <p class="error-message">Page not found</p>
      <a href="ricky.html" class="btn btn--secondary">Return to Homepage</a>
    </main>

    <!-- Footer -->
    <div class="footer-wrapper">
      <div class="container">
        <footer class="footer">
          <div class="footer__inner">
            <a href="ricky.html" class="footer__logo">
              <img src="img/ricky/logo.svg" alt="Ricky Casino Logo" />
            </a>
            <nav class="footer__links">
              <a href="#" class="footer__link">Terms and Conditions</a>
              <a href="#" class="footer__link">Privacy Policy</a>
            </nav>
          </div>
          <p class="footer__copyright">
            Copyright © 2026 Ricky Casino. All rights reserved. You must be at
